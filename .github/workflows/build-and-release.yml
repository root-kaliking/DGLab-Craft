name: Auto Build on Every Commit

on:
  push:
    branches: [ 1.19.2 ]
  pull_request:
    branches: [ 1.19.2 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle (with retry)
        run: |
          # 最多重试3次，每次间隔5秒
          for i in 1 2 3; do
            ./gradlew build --stacktrace -Dorg.gradle.daemon=false -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 && break
            echo "第 $i 次构建失败，5秒后重试..."
            sleep 5
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DGLab-Craft-Build
          path: build/libs/*.jar
