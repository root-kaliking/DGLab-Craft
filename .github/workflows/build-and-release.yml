name: Auto Build on Every Commit

on:
  push:
    branches: [ 1.19.2 ]
  pull_request:
    branches: [ 1.19.2 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 关键：配置 Gradle 使用国内镜像
      - name: Configure Gradle mirror
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.daemon=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configureondemand=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "systemProp.https.proxyHost=mirrors.cloud.tencent.com" >> ~/.gradle/gradle.properties
          echo "systemProp.https.proxyPort=443" >> ~/.gradle/gradle.properties
          echo "systemProp.https.proxyUser=" >> ~/.gradle/gradle.properties
          echo "systemProp.https.proxyPassword=" >> ~/.gradle/gradle.properties
          echo "systemProp.https.nonProxyHosts=*.baidu.com|*.bcebos.com" >> ~/.gradle/gradle.properties
          echo "systemProp.http.proxyHost=mirrors.cloud.tencent.com" >> ~/.gradle/gradle.properties
          echo "systemProp.http.proxyPort=80" >> ~/.gradle/gradle.properties
          echo "systemProp.http.proxyUser=" >> ~/.gradle/gradle.properties
          echo "systemProp.http.proxyPassword=" >> ~/.gradle/gradle.properties
          echo "systemProp.http.nonProxyHosts=*.baidu.com|*.bcebos.com" >> ~/.gradle/gradle.properties

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DGLab-Craft-Build
          path: build/libs/*.jar
