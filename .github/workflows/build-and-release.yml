name: Auto Build on Every Commit

on:
  push:
    branches: [ 1.19.2 ]
  pull_request:
    branches: [ 1.19.2 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 直接下载 Gradle 并解压，不用 gradlew
      - name: Download and setup Gradle 8.8
        run: |
          wget -q https://mirrors.aliyun.com/maven/gradle/gradle-8.8-bin.zip
          unzip -q gradle-8.8-bin.zip -d $HOME
          echo "$HOME/gradle-8.8/bin" >> $GITHUB_PATH

      - name: Build with Gradle
        run: gradle build --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DGLab-Craft-Build
          path: build/libs/*.jar
